name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip queued builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # withastro/action 自动按 package.json 的 packageManager 字段安装 pnpm，
      # 再执行 pnpm build（含 pagefind 索引）。无需额外 setup-node / action-setup。
      # 项目锁定 pnpm@11，需要 Node ≥ 22.13（pnpm 11 依赖 node:sqlite）。
      - name: Build site (Astro + Pagefind)
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
